{% extends "base.html" %}

{% block main %}
<main id="main-content" class="container not-found-main" tabindex="-1">
  <div class="not-found-card">
    <p class="not-found-code" aria-hidden="true">404</p>
    <h1 id="404-title">Page Not Found</h1>
    <p id="404-body">The requested page does not exist. Try searching above or return to the <a href="{{ site.base_path }}/">PySceneDetect homepage</a>.</p>
  </div>
</main>

<script>
(function() {
  var basePath = "{{ site.base_path }}";
  var rawPath = window.location.pathname;
  var path = basePath && rawPath.indexOf(basePath + "/") === 0
    ? rawPath.substring(basePath.length)
    : rawPath;
  var pageTitle = document.getElementById("404-title");
  var pageBody = document.getElementById("404-body");

  function showRedirect(url, labelText) {
    if (pageTitle) {
      pageTitle.textContent = "Redirecting...";
    }
    if (pageBody) {
      pageBody.textContent = "Redirecting to ";
      var link = document.createElement("a");
      link.href = url;
      link.textContent = labelText;
      pageBody.appendChild(link);
    }
    window.location.href = url;
  }

  var hash = window.location.hash || "";

  // Redirect /issue(s) and /issue(s)/<id>[/<rest>] to GitHub issues.
  if (/^\/issues?\/?$/.test(path)) {
    showRedirect("{{ site.repo_url }}/issues/" + hash, "GitHub issues...");
    return;
  }

  var issueMatch = path.match(/^\/issues?\/(\d+)(?:\/([\w./-]*))?$/);
  if (issueMatch) {
    var issueId = issueMatch[1];
    var issueRest = (issueMatch[2] || "").replace(/^\/+|\/+$/g, "");
    if (issueRest.split("/").indexOf("..") === -1) {
      var targetUrl = "{{ site.repo_url }}/issues/" + encodeURIComponent(issueId)
        + (issueRest ? "/" + issueRest : "") + hash;
      showRedirect(targetUrl, "issue #" + issueId + " on GitHub...");
      return;
    }
  }

  var issueActionMatch = path.match(/^\/issues?\/(new(?:\/choose)?)\/?$/);
  if (issueActionMatch) {
    showRedirect("{{ site.repo_url }}/issues/" + issueActionMatch[1] + hash, "GitHub issues...");
    return;
  }

  // Redirect legacy ReadTheDocs subproject URLs (/projects/Manual/en/<ver>/<path>).
  var manualMatch = path.match(
    /^\/projects\/Manual\/en\/v?(latest|stable|head|\d+\.\d+(?:\.\d+)?)(?:\/([\w./-]*))?$/
  );
  if (manualMatch) {
    var verSlug = manualMatch[1] === "stable" ? "latest" : manualMatch[1];
    var docRest = (manualMatch[2] || "").replace(/^\/+/, "");
    if (docRest.split("/").indexOf("..") === -1) {
      showRedirect("/docs/" + verSlug + "/" + docRest + hash, "documentation...");
    }
  }
})();
</script>
{% endblock %}
