{%- if pagename != "search" and builder != "singlehtml" %}
<search class="psd-searchbox">
  <form class="search" action="{{ pathto('search') }}" method="get">
    <input type="search" name="q" aria-label="{{ _('Search documentation') }}" placeholder="{{ _('Search docs...') }}" autocapitalize="off" autocorrect="off" spellcheck="false" />
  </form>
</search>
{%- endif %}
