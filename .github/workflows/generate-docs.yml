# Generate PySceneDetect documentation and updates the gh-pages branch.
name: Generate Documentation

on:
  push:
    branches:
      - main            # docs/head
      - 'releases/**'   # docs/**
    paths:
      - 'docs/**'
      - 'scenedetect/**'
      - 'scenedetect.cfg'
      - 'website/pages/docs.md'
  workflow_dispatch:

concurrency:
  group: gh-pages-docs
  cancel-in-progress: false

jobs:
  update_docs:
    runs-on: ubuntu-latest
    if: github.repository == 'Breakthrough/PySceneDetect'
    permissions:
      contents: write  # pushes generated docs to the gh-pages branch
    env:
      scenedetect_docs_dest: ''

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Get Latest Version
        run: |
          git fetch origin main --depth=1
          echo "scenedetect_docs_latest=$(git show origin/main:docs/LATEST_VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set Destination (Releases)
        if: ${{ startsWith(github.ref, 'refs/heads/releases/') }}
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "scenedetect_docs_dest=${REF_NAME#releases/}" >> "$GITHUB_ENV"

      - name: Set Destination (Head)
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          echo "scenedetect_docs_dest=head" >> "$GITHUB_ENV"

      - name: Check Destination
        if: ${{ env.scenedetect_docs_dest == '' }}
        shell: bash
        run: |
          echo "Failing build: destination must be set!"
          exit 1

      - name: Setup Environment
        run: |
          pip install ".[docs,pyav,moviepy]"
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Check CLI Documentation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B docs/generate_cli_docs.py
          if [[ $(git status --porcelain=1 -- docs | wc -l) -ne 0 ]]; then
            git --no-pager diff -- docs
            echo 'CLI documentation is out of date: the generated docs do not match the output of docs/generate_cli_docs.py!'
            echo 'Re-run "python docs/generate_cli_docs.py" and commit the result.'
            exit 1
          fi

      - name: Generate Docs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          sphinx-build -b html -d "${RUNNER_TEMP}/doctrees" docs "${RUNNER_TEMP}/docs-build"

      - name: Update gh-pages Branch
        shell: bash
        env:
          DOCS_DEST: ${{ env.scenedetect_docs_dest }}
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git clean -ffdx
          git rm "docs/${DOCS_DEST}" -r -f --ignore-unmatch
          mkdir -p "docs/${DOCS_DEST}"
          cp -a "${RUNNER_TEMP}/docs-build/." "docs/${DOCS_DEST}/"
          git add -A "docs/${DOCS_DEST}"

      - name: Update Latest
        if: ${{ env.scenedetect_docs_dest == env.scenedetect_docs_latest }}
        shell: bash
        env:
          DOCS_DEST: ${{ env.scenedetect_docs_dest }}
        run: |
          git rm "docs/latest" -r -f --ignore-unmatch
          cp -a "docs/${DOCS_DEST}" docs/latest
          git add -A docs/latest
          echo "scenedetect_docs_dest=${DOCS_DEST} (latest)" >> "$GITHUB_ENV"

      - name: Commit and Push
        shell: bash
        env:
          DOCS_DEST: ${{ env.scenedetect_docs_dest }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git commit -a -m "[docs] @${TRIGGER_ACTOR}: Generate Documentation" \
              -m "Source: ${GITHUB_REF_NAME} (${GITHUB_SHA})" \
              -m "Destination: ${DOCS_DEST}"
            for attempt in 1 2 3 4 5; do
              if git push origin gh-pages; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "Failed to push to gh-pages after ${attempt} attempts." >&2
                exit 1
              fi
              echo "Push failed (attempt ${attempt}/5); rebasing onto origin/gh-pages and retrying..."
              sleep $((attempt * 2))
              git fetch origin gh-pages
              git pull --rebase origin gh-pages
            done
          fi
