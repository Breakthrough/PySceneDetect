# CodeQL for PySceneDetect
name: "CodeQL"

on:
  push:
    branches:
     - main
     - releases/**
    paths:
      - scenedetect/**
      - tests/**
  pull_request:
    branches:
     - main
     - releases/*
    paths:
      - scenedetect/**
      - tests/**
  schedule:
    - cron: "20 7 * * 4"

jobs:
  analyze:
    name: Analyze
    # Skip scheduled runs in forks: GitHub attributes cron runs to the upstream
    # workflow author, who then gets emailed when a fork's scheduled run fails.
    if: github.repository_owner == 'Breakthrough' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ python ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
