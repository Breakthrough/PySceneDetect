
name: Generate Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'docs/LATEST_VERSION'
      - 'docs/_ext/doc_versions.py'
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  update_site:
    runs-on: ubuntu-latest
    if: github.repository == 'Breakthrough/PySceneDetect'
    permissions:
      contents: write  # pushes generated site to the gh-pages branch

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install "jinja2>=3.1.6" "markdown>=3.5" "pygments>=2.17"

      - name: Generate Website
        run: |
          python website/build.py --strict

      - name: Update Website
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git rm * -r -f --ignore-unmatch
          git checkout HEAD -- .nojekyll
          git checkout HEAD -- CNAME
          git checkout HEAD -- docs/
          git rm docs/index.html --ignore-unmatch
          git add website/build/
          git mv website/build/* . -f -k
          git mv website/build/docs/index.html docs/index.html -k
          git rm website/build/* -r -f --ignore-unmatch
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git commit -a -m "[docs] @${{ github.triggering_actor }}: Generate Website" \
              -m "Commit: ${{ github.sha }}"
            git push
          fi
